name: Deploy

# Every push to main goes live at https://cantare.unlikeotherai.com (Cloudflare Pages).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://cantare.unlikeotherai.com
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # Deploys dist/ plus the Pages Functions in functions/ (the /api routes). Wrangler runs
      # through npx: installing it with pnpm 11 fails on its unapproved build scripts.
      - run: npx --yes wrangler@4.149.0 pages deploy dist --project-name=cantare --branch=main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
